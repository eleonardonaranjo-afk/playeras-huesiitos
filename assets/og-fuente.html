<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fuente de assets/og.jpg</title>
<!-- ===================================================================
     De aqui sale assets/og.jpg, la imagen que se ve al compartir el
     sitio en WhatsApp, Facebook o Twitter.
     Para regenerarla: abre este archivo en el navegador a 1200x630 px
     y toma una captura, o usa el comando que viene en el README.
     =================================================================== -->
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;500&family=Titan+One&display=swap" rel="stylesheet">
<script src="../script.js"></script>
<style>
  *{box-sizing:border-box;margin:0}
  body{
    width:1200px;height:630px;overflow:hidden;
    background:#171017;color:#fff;
    font-family:'Jost',system-ui,sans-serif;font-weight:300;
    display:grid;grid-template-columns:1.02fr .98fr;align-items:center;
  }
  .texto{padding:0 0 0 74px}
  .sello{
    display:inline-block;margin-bottom:22px;padding:9px 20px;
    border:1px solid rgba(255,255,255,.42);border-radius:999px;
    font-size:19px;letter-spacing:.2em;text-transform:uppercase;
  }
  h1{font-family:'Titan One',serif;font-weight:400;font-size:84px;line-height:.98;color:#e6007e}
  h2{font-family:'Titan One',serif;font-weight:400;font-size:41px;line-height:1.12;margin:18px 0 16px}
  h2 em{font-style:normal;color:#ffc700}
  p{font-size:25px;line-height:1.45;color:rgba(255,255,255,.8);max-width:20ch}
  .precio{
    display:inline-block;margin-top:26px;padding:12px 26px;border-radius:999px;
    background:#ffc700;color:#171017;font-weight:500;font-size:23px;letter-spacing:.06em;
  }
  .muestrario{
    display:grid;grid-template-columns:repeat(2,1fr);gap:22px;
    padding:0 66px 0 30px;
  }
  .pieza{
    display:grid;place-items:center;aspect-ratio:1/1.08;
    border-radius:26px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.13);
  }
  .pieza svg{width:80%;height:80%}
  .pieza:nth-child(2),.pieza:nth-child(3){transform:translateY(-16px)}
</style>
</head>
<body>
  <div class="texto">
    <span class="sello">Hecho a mano en Mexico</span>
    <h1>¡HUESITOS!</h1>
    <h2>Playeras que <em>cuentan</em> algo</h2>
    <p>Calaveras, ajolotes, mascaras, alebrijes y tradicion, pintados uno por uno.</p>
    <span class="precio">TODAS A $280 MXN</span>
  </div>
  <div class="muestrario">
    <div class="pieza" data-dibujo="calaveras" data-playera="#fdf7f2" data-motivo="#e6007e"></div>
    <div class="pieza" data-dibujo="ajolotes"  data-playera="#e6007e" data-motivo="#ffffff"></div>
    <div class="pieza" data-dibujo="mascaras"  data-playera="#c3122f" data-motivo="#ffc700"></div>
    <div class="pieza" data-dibujo="alebrijes" data-playera="#00b0a6" data-motivo="#171017"></div>
  </div>
</body>
</html>
